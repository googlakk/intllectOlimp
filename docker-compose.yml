services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intellect
      POSTGRES_PASSWORD: intellect
      POSTGRES_DB: intellect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellect"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
