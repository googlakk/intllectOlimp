[pytest]
# Собираем тесты только из самого backend, не заглядывая в служебные каталоги.
# _to_delete — папка, куда складывается отменённое: её содержимое заведомо
# нерабочее, и подбирать оттуда тесты нельзя, иначе прогон падает на импорте
# функций, которых больше нет.
testpaths = .
norecursedirs = _to_delete .venv venv node_modules testdata __pycache__ .git artifacts
python_files = test_*.py
